name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - security-checks

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test all workspaces
        run: npm run check

  integration-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install verified local PostgreSQL runtime
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Setup-LocalTestDatabase.ps1

      - name: Verify migrations and database invariants
        run: npm run test:db

      - name: Verify HTTP, Stripe and Swish integration flows
        run: npm run test:api

      - name: Verify operator connection isolation
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-PostgresConnectionIsolation.ps1
